services:
  postgres:
    image: postgres:17-alpine
    container_name: vetly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetly
      POSTGRES_USER: vetly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Athens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vetly_default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetly -d vetly"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./vetly-back
    container_name: vetly-backend
    restart: unless-stopped
    environment: &backend-environment
      DATABASE_URL: postgresql://vetly:${DB_PASSWORD}@postgres:5432/vetly
      SECRET_KEY: ${SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      ENVIRONMENT: production
      PILOT_MODE: ${PILOT_MODE:-false}
      PILOT_ALLOWED_EMAILS: ${PILOT_ALLOWED_EMAILS:-[]}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALLOWED_ORIGINS: '["https://vetly.gr"]'
      EMAIL_NOTIFICATIONS_ENABLED: ${EMAIL_NOTIFICATIONS_ENABLED:-false}
      PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      TZ: Europe/Athens
      EMAIL_FROM: ${EMAIL_FROM:-Vetly <noreply@vetly.gr>}
      FRONTEND_URL: ${FRONTEND_URL:-https://vetly.gr}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/apps/vetly/uploads:/app/uploads
    networks:
      - vetly_default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  reminder-worker:
    profiles: [pilot]
    build: ./vetly-back
    restart: unless-stopped
    command: ["python", "-m", "scripts.reminder_worker"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vetly_default
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./vetly-front
      args:
        NEXT_PUBLIC_API_URL: https://vetly.gr/api/v1
    container_name: vetly-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - vetly_default
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  postgres_data:

networks:
  vetly_default:
    external: true
