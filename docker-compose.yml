services:
  postgres:
    image: postgres:17-alpine
    container_name: vetly-postgres
    environment:
      POSTGRES_DB: vetly
      POSTGRES_USER: vetly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetly -d vetly"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./vetly-back
    container_name: vetly-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://vetly:${DB_PASSWORD}@postgres:5432/vetly
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./vetly-back:/app

  frontend:
    build: ./vetly-front
    container_name: vetly-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

  landing:
    build: ./vetly-landing-page
    container_name: vetly-landing
    ports:
      - "3001:3001"

volumes:
  postgres_data:
