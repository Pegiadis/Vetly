services:
  postgres:
    image: postgres:17-alpine
    container_name: vetly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vetly
      POSTGRES_USER: vetly
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vetly -d vetly"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - vetly-net

  backend:
    build: ../vetly-back
    container_name: vetly-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vetly:${DB_PASSWORD}@postgres:5432/vetly
      SECRET_KEY: ${SECRET_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: '["https://vetly.gr"]'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - vetly-net

  frontend:
    build:
      context: ../vetly-front
      args:
        NEXT_PUBLIC_API_URL: https://api.vetly.gr/api/v1
    container_name: vetly-frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - vetly-net

  nginx:
    image: nginx:alpine
    container_name: vetly-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vetly-net

  certbot:
    image: certbot/certbot
    container_name: vetly-certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  uploads_data:
  certbot_conf:
  certbot_www:

networks:
  vetly-net:
    driver: bridge
